<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicola Lanta — Reel</title>
<meta name="description" content="Scroll-driven 3D cinematic chapter reel.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ───────────────────────────── tokens ───────────────────────────── */
@property --wipe { syntax: '<number>'; inherits: true; initial-value: 1; }

:root{
  --num-size: min(17.7vw, 21.1vh);
  --num-stride: .94;
  --num-lift: .0766em;
  --num-ink: #fff;
  --num-line: rgba(255,255,255,.62);
  --num-squeeze: .728;
  --scrim: .58;
  --vignette: .68;
  --pad-x: 32px;
  --ease: cubic-bezier(.22,.61,.24,1);
  --serif: "Playfair Display", "Times New Roman", Georgia, serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scrollbar-width:none; background:#0b0a09; }
html::-webkit-scrollbar{ width:0; height:0; }
body{
  margin:0; background:#0b0a09; color:#fff;
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
}
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
:focus-visible{ outline:1px solid rgba(255,255,255,.8); outline-offset:3px; border-radius:2px; }

/* ─────────────────── scroll track (drives the dolly) ─────────────────── */
.track{ position:relative; z-index:0; }

/* ───────────────────────────── stage ───────────────────────────── */
.stage{
  position:fixed; inset:0; z-index:1; overflow:hidden;
  background:#0b0a09;
}

/* ═══════════════════════ 3D depth stack ═══════════════════════
   One .layer per video. JS drives translate3d Z + scale so the
   camera dollies THROUGH the stack. No cards, no borders — every
   layer is full-bleed media, overscanned so a receding layer never
   uncovers the viewport edge.
   ────────────────────────────────────────────────────────────── */
.depth-stack{
  position:absolute; inset:0; z-index:0;
  perspective:1200px;
  transform-style:preserve-3d;
}
.layer{
  position:absolute; inset:0;
  transform-origin:50% 50%;
  backface-visibility:hidden;
}
.layer-inner{
  /* overscan: the media is larger than the viewport, so a layer pushed
     back by perspective still covers every edge */
  position:absolute; inset:-11%;
  /* cinematic media treatment — constant, so the filter is rasterised
     once and cached rather than re-rendered every frame */
  filter:contrast(1.12) saturate(.86) brightness(.94);
}
/* depth dimming rides on opacity, which the compositor handles alone */
.layer-dim{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  background:#070706; opacity:0;
}
.layer video, .layer .ph{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block;
}
.layer video{ z-index:1; }
.layer.no-video video{ display:none; }

/* procedural placeholder — also the graceful fallback when a video 404s */
.ph{
  background:
    radial-gradient(120% 90% at 22% 12%, rgba(255,255,255,.10), transparent 60%),
    linear-gradient(168deg, var(--ph1) 0%, var(--ph2) 58%, var(--ph3) 100%);
}
.ph::before{
  content:""; position:absolute; inset:0; opacity:.28;
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 1px, transparent 1px 26px);
}
.ph-tag{
  position:absolute; left:50%; top:21%; transform:translateX(-50%); z-index:2;
  font-family:var(--mono);
  font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap;
  color:rgba(255,255,255,.34);
  border:1px solid rgba(255,255,255,.14); border-radius:999px;
  padding:5px 12px;
}
.layer:not(.no-video) .ph-tag{ display:none; }

/* one global scrim over the whole stack — never stacks up per layer */
.scrim{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.15) 34%, rgba(0,0,0,.35));
  opacity:var(--scrim);
}

/* chapter cut — a short tape-dip between project stacks */
.cut-flash{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  opacity:0; background:#080807;
}
.cut-flash::after{
  content:""; position:absolute; left:0; right:0; top:50%; height:1px;
  background:rgba(255,255,255,.5);
}

/* ── grain + vignette ── */
.grain,.vignette{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.grain{
  opacity:.055; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}
.vignette{
  background:radial-gradient(115% 88% at 50% 46%, transparent 42%, rgba(0,0,0,.85) 100%);
  opacity:var(--vignette);
}

/* ── chapter numerals ── */
.numerals{
  position:absolute; inset:0; pointer-events:none; z-index:4;
  transform-style:preserve-3d;
  will-change:transform;
}
.num{
  position:absolute; left:50%; top:50%;
  font-family:var(--serif); font-weight:400; line-height:.86;
  font-size:var(--num-size); letter-spacing:-.012em; white-space:nowrap;
  transform-origin:50% 50%;
  will-change:transform,opacity;
}
.num-squeeze{ display:block; transform:translateY(calc(var(--num-lift) * -1)) scaleX(var(--num-squeeze)); transform-origin:50% 50%; }
.num span.layer{ display:block; grid-area:1/1; position:static; inset:auto; }
.num-stack{ display:grid; }
.num .fill{ color:var(--num-ink); text-shadow:0 6px 44px rgba(0,0,0,.42); }
.num .out{
  color:transparent;
  -webkit-text-stroke:1.15px var(--num-line);
  text-stroke:1.15px var(--num-line);
}

/* ── editorial content block ── */
.content-layer{ position:absolute; inset:0; pointer-events:none; z-index:5; }
/* CONTENT placement — bottom-left, permanently */
.content{
  position:absolute; left:var(--pad-x); bottom:56px; width:min(430px, 62vw);
  opacity:0; visibility:hidden; pointer-events:none;
}
.content.is-on{ opacity:1; visibility:visible; pointer-events:auto; }

.content h1{
  font-family:var(--serif); font-weight:400;
  font-size:clamp(26px, 3.29vw, 42px); line-height:1.08; letter-spacing:-.015em;
  margin:0; color:#fff;
}
.rule{ width:62px; height:1px; background:rgba(255,255,255,.55); margin:18px 0 17px; }
.content p{
  margin:0; font-size:15px; line-height:24px; font-weight:300;
  color:rgba(255,255,255,.76);
}
.cta{
  display:inline-flex; align-items:center; justify-content:center;
  margin-top:17px; height:36px; padding:0 21px;
  border:1px solid rgba(255,255,255,.5); border-radius:999px;
  font-size:11px; font-weight:400; letter-spacing:.18em; text-transform:uppercase;
  color:#fff; text-decoration:none; white-space:nowrap;
  transition:background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
}
.cta:hover{ background:#fff; color:#111; border-color:#fff; }

/* wipe reveal (a hairline sweeps left→right, uncovering the line) */
.reveal{ position:relative; }
.content.is-on .reveal{ animation:wipe .78s var(--ease) both; }
.content.is-on h1.reveal{ animation-delay:.02s; }
.content.is-on .rule-wrap.reveal{ animation-delay:.12s; }
.content.is-on p.reveal{ animation-delay:.19s; }
.content.is-on .cta-wrap.reveal{ animation-delay:.3s; }
@keyframes wipe{
  from{ --wipe:0; opacity:.001; }
  6%  { opacity:1; }
  to  { --wipe:1; opacity:1; }
}
.reveal{ clip-path:inset(-.35em calc((1 - var(--wipe)) * 100%) -.28em -.2em); }
.reveal::after{
  content:""; position:absolute; top:-.32em; bottom:-.26em;
  left:calc(var(--wipe) * 100%); width:1px;
  background:rgba(255,255,255,.9);
  opacity:calc(1 - var(--wipe));
}
.content:not(.is-on) .reveal::after{ display:none; }

/* ── progress rail (right) — global position across the whole reel ── */
.rail{
  position:absolute; right:26px; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:14px; z-index:6;
}
.rail-line{ position:relative; width:1px; height:30vh; background:rgba(255,255,255,.2); }
.rail-fill{
  position:absolute; left:-.25px; top:0; width:1.5px; height:100%;
  background:#fff;
  transform:scaleY(0); transform-origin:50% 0;
}
.rail-idx{
  font-size:9.5px; letter-spacing:.22em; color:rgba(255,255,255,.62);
  writing-mode:vertical-rl; font-variant-numeric:tabular-nums;
}

/* ── inset border — always on ── */
.frame{
  position:absolute; inset:14px; border:1px solid rgba(255,255,255,.28);
  border-radius:3px; pointer-events:none; z-index:7;
}

/* ══════════════════════════ camcorder HUD ══════════════════════════
   Viewfinder overlay: REC light, running timer, battery, framing
   brackets and the scanline texture. Entirely self-contained.
   ─────────────────────────────────────────────────────────────────── */
.camcorder-hud{
  position:fixed; inset:0; z-index:8;
  pointer-events:none;
  font-family:var(--mono);
  --hud-pad:42px;
  --hud-arm:20px;
  --hud-ink:rgba(255,255,255,.82);
  --hud-red:#ff3b30;
  /* enlarged HUD readouts — tuned down per breakpoint below */
  --rec-font:23px;   --rec-dot:18px;
  --sound-font:15px; --sound-bar-h:15px;
  --timer-font:30px;
  --batt-w:66px; --batt-h:31px; --batt-border:3px; --batt-pad:4px; --batt-gap:4px;
  --batt-cap-w:6px;  --batt-cap-h:15px;
}
.camcorder-hud *{ pointer-events:none; }

/* ── REC indicator (top-left) ── */
.hud-top-left{
  position:absolute; left:var(--hud-pad); top:var(--hud-pad);
  display:flex; align-items:center; gap:26px;
}
.rec-indicator{
  display:flex; align-items:center; gap:10px;
  font-size:var(--rec-font); font-weight:700; letter-spacing:.2em; text-transform:uppercase;
  color:var(--hud-ink);
  text-shadow:0 2px 14px rgba(0,0,0,.65);
}
.rec-dot{
  width:var(--rec-dot); height:var(--rec-dot); border-radius:50%;
  background:var(--hud-red);
  animation:rec-pulse 1.4s var(--ease) infinite;
}
@keyframes rec-pulse{
  0%, 54% { opacity:1;   box-shadow:0 0 12px rgba(255,59,48,.55); }
  74%     { opacity:.34; box-shadow:0 0 0 rgba(255,59,48,0); }
  100%    { opacity:1;   box-shadow:0 0 12px rgba(255,59,48,.55); }
}

/* ── audio toggle (top-left, beside REC) ──
   A browser only lets a playing video unmute off the back of a user
   gesture, so this is a real button rather than an automatic behaviour.
   Styled as a camcorder audio-level readout: three meter bars that only
   animate while sound is live. ── */
.hud-sound{
  display:flex; align-items:center; gap:8px;
  font-family:var(--mono); font-size:var(--sound-font);
  font-weight:700; letter-spacing:.2em; text-transform:uppercase; white-space:nowrap;
  color:var(--hud-ink); opacity:.7;
  text-shadow:0 2px 14px rgba(0,0,0,.65);
  transition:opacity .3s var(--ease), color .3s var(--ease);
}
.camcorder-hud .hud-sound{ pointer-events:auto; }
.hud-sound:hover, .hud-sound:focus-visible{ opacity:1; }
.hud-sound.is-on{ opacity:1; color:#fff; }

.sound-meter{ display:flex; align-items:center; gap:2.5px; height:var(--sound-bar-h); }
.sound-meter i{
  display:block; width:2.5px; height:34%;
  background:currentColor; opacity:.45;
}
.hud-sound.is-on .sound-meter i{
  opacity:1;
  animation:meter-bounce .62s var(--ease) infinite alternate;
}
.hud-sound.is-on .sound-meter i:nth-child(2){ animation-duration:.43s; }
.hud-sound.is-on .sound-meter i:nth-child(3){ animation-duration:.79s; }
@keyframes meter-bounce{
  from{ transform:scaleY(.4); }
  to  { transform:scaleY(2.8); }
}

/* ── "Nicola Lanta" page link + battery (top-right) ──
   Styled identically to .rec-indicator — same font-size, weight,
   letter-spacing and text-shadow — so it reads as a matching HUD
   readout in the accent red. A real link to a separate page, not an
   overlay trigger. ── */
.hud-top-right{
  position:absolute; right:var(--hud-pad); top:var(--hud-pad);
  display:flex; align-items:center; gap:28px;
}
.hud-page-link{
  font-family:var(--mono); font-size:var(--rec-font); font-weight:700;
  letter-spacing:.2em; text-transform:uppercase; white-space:nowrap;
  color:var(--hud-red); text-decoration:none;
  text-shadow:0 2px 14px rgba(0,0,0,.65);
  opacity:.94;
  transition:opacity .3s var(--ease), color .3s var(--ease);
}
.camcorder-hud .hud-page-link{ pointer-events:auto; }
.hud-page-link:hover, .hud-page-link:focus-visible{ opacity:1; color:#ff6a60; }

/* Change data-level to 3 / 2 / 1 / 0 and that many segments stay lit. */
.battery-indicator{
  display:flex; align-items:center; gap:4px;
  opacity:.9;
}
.battery-body{
  display:flex; align-items:stretch; gap:var(--batt-gap);
  width:var(--batt-w); height:var(--batt-h); padding:var(--batt-pad);
  border:var(--batt-border) solid rgba(255,255,255,.6); border-radius:3px;
}
.battery-segment{ flex:1; background:rgba(255,255,255,.16); }
.battery-indicator[data-level="1"] .battery-segment:nth-child(-n+1),
.battery-indicator[data-level="2"] .battery-segment:nth-child(-n+2),
.battery-indicator[data-level="3"] .battery-segment:nth-child(-n+3),
.battery-indicator[data-level="4"] .battery-segment:nth-child(-n+4){
  background:rgba(255,255,255,.8);
}
.battery-cap{
  width:var(--batt-cap-w); height:var(--batt-cap-h); border-radius:0 2px 2px 0;
  background:rgba(255,255,255,.6);
}

/* ── recording timer (bottom-right) ── */
.recording-timer{
  position:absolute; right:var(--hud-pad); bottom:var(--hud-pad);
  font-size:var(--timer-font); font-weight:500; letter-spacing:.1em;
  font-variant-numeric:tabular-nums;
  color:rgba(255,255,255,.68);
  text-shadow:0 2px 14px rgba(0,0,0,.65);
}

/* ── viewfinder brackets — sit on the corners of the existing .frame ── */
.viewfinder{ position:absolute; inset:14px; }
.viewfinder-corner{
  position:absolute; width:var(--hud-arm); height:var(--hud-arm);
  border:1px solid rgba(255,255,255,.72);
}
.viewfinder-corner.tl{ top:0;    left:0;  border-right:0; border-bottom:0; }
.viewfinder-corner.tr{ top:0;    right:0; border-left:0;  border-bottom:0; }
.viewfinder-corner.bl{ bottom:0; left:0;  border-right:0; border-top:0;    }
.viewfinder-corner.br{ bottom:0; right:0; border-left:0;  border-top:0;    }

/* ── scanlines / CRT texture ── */
.scanlines{
  position:absolute; inset:0; opacity:.55;
  background:repeating-linear-gradient(180deg,
    rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
}
.scanlines::after{
  content:""; position:absolute; left:0; right:0; top:0; height:26%;
  background:linear-gradient(180deg,
    transparent, rgba(255,255,255,.05) 48%, transparent);
  will-change:transform;
  animation:head-drift 9s linear infinite;
}
/* transform, not `top` — `top` relayouts the full-screen band every frame */
@keyframes head-drift{
  from{ transform:translateY(-110%); }
  to  { transform:translateY(400%); }
}

/* ── responsive ── */
@media (max-width: 900px){
  :root{ --pad-x:20px; --num-size:min(23vw, 17vh); }
  .content{ width:min(430px, 80vw); }
  .rail{ right:14px; }
  .camcorder-hud{
    --hud-pad:32px; --hud-arm:12px;
    --rec-font:17px; --rec-dot:14px;
    --sound-font:11px; --sound-bar-h:11px;
    --timer-font:22px;
    --batt-w:50px; --batt-h:23px; --batt-border:2.2px; --batt-pad:3.2px; --batt-gap:3.2px;
    --batt-cap-w:4px; --batt-cap-h:10px;
  }
  .rec-indicator{ gap:7px; letter-spacing:.16em; }
  .hud-top-left{ gap:16px; }
  .hud-sound{ gap:6px; letter-spacing:.14em; }
  .hud-top-right{ gap:18px; }
  .depth-stack{ perspective:900px; }
  /* lift the copy off the numerals */
  .stage::before{
    content:""; position:absolute; inset:38% 0 0 0; z-index:4; pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,.5) 55%, rgba(0,0,0,.82));
  }
}
@media (max-width: 560px){
  :root{ --num-size:min(26vw, 16vh); }
  .content h1{ font-size:26px; }
  .content p{ font-size:13.5px; }
  .camcorder-hud{
    --rec-font:13px; --rec-dot:11px;
    --sound-font:9px; --sound-bar-h:9px;
    --timer-font:17px;
    --batt-w:38px; --batt-h:18px; --batt-border:1.6px; --batt-pad:2.4px; --batt-gap:2.4px;
    --batt-cap-w:3px; --batt-cap-h:8px;
  }
  .hud-top-right{ gap:12px; }
}

@media (prefers-reduced-motion: reduce){
  .content.is-on .reveal{ animation-duration:.01s; }
  .rec-dot{ animation:none; opacity:1; box-shadow:0 0 12px rgba(255,59,48,.55); }
  .hud-sound.is-on .sound-meter i{ animation:none; transform:scaleY(1.6); }
  .scanlines::after{ animation:none; display:none; }
}

</style>
</head>

<body>

<main class="stage" id="stage">

  <!-- video layers are generated into here -->
  <div class="depth-stack" id="depthStack"></div>

  <div class="scrim" aria-hidden="true"></div>
  <div class="cut-flash" id="cutFlash" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- chapter numerals are generated into here -->
  <div class="numerals" id="numerals" aria-hidden="true"></div>

  <!-- ══ editorial copy — text swaps on chapter change ══ -->
  <div class="content-layer">
    <article class="content is-on" id="chapterCopy">
      <h1 class="reveal" id="chapterTitle"></h1>
      <div class="rule-wrap reveal"><div class="rule"></div></div>
      <p class="reveal" id="chapterDesc"></p>
      <div class="cta-wrap reveal"><a class="cta" href="#">View project</a></div>
    </article>
  </div>

  <div class="rail" id="rail">
    <div class="rail-line"><div class="rail-fill" id="railFill"></div></div>
    <div class="rail-idx" id="railIdx">01 — 01</div>
  </div>

  <div class="frame" aria-hidden="true"></div>

</main>

<!-- ══════════════════════ camcorder HUD ══════════════════════
     aria-hidden sits on the decorative pieces individually, not on this
     wrapper — the "NICOLA LANTA" page link inside it is a real
     interactive control and must stay reachable by assistive tech. -->
<div class="camcorder-hud">
  <div class="hud-top-left">
    <div class="rec-indicator" aria-hidden="true"><span class="rec-dot"></span>REC</div>

    <!-- real control: the reel starts muted because browsers require a
         gesture before a playing video may unmute -->
    <button class="hud-sound" id="soundToggle" type="button" aria-pressed="false">
      <span class="sound-meter" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="soundLabel">Audio Off</span>
    </button>
  </div>

  <div class="hud-top-right">
    <a class="hud-page-link" href="about.html">Nicola Lanta</a>

    <div class="battery-indicator" data-level="4" aria-hidden="true">
      <div class="battery-body">
        <span class="battery-segment"></span>
        <span class="battery-segment"></span>
        <span class="battery-segment"></span>
        <span class="battery-segment"></span>
      </div>
      <div class="battery-cap"></div>
    </div>
  </div>

  <div class="recording-timer" id="recTimer" aria-hidden="true">00:00:00</div>

  <div class="viewfinder" aria-hidden="true">
    <span class="viewfinder-corner tl"></span>
    <span class="viewfinder-corner tr"></span>
    <span class="viewfinder-corner bl"></span>
    <span class="viewfinder-corner br"></span>
  </div>

  <div class="scanlines" aria-hidden="true"></div>
</div>

<div class="track" id="track" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   1 · CONTENT — the only thing you edit.

   Add or remove chapters, add or remove videos inside a chapter: the
   depth maths below derives everything (fractional depths, scroll
   length, rail, numerals) from this array. Nothing else to touch.
   ═══════════════════════════════════════════════════════════════════ */
const chapters = [
  {
    title: "Guess",
    description: "Black-and-white campaign film for the house — edit, grade and finishing on the final cut.",
    videos: [
      "assets/20251025_Guess_B%26W_v3.mp4"
    ]
  },
  {
    title: "Marciano Willem",
    description: "Monochrome fashion piece for Marciano — filming and post through to the delivered edit.",
    videos: [
      "assets/20251025_Marciano_B%26W_1.mp4"
    ]
  },
  {
    title: "Adidas",
    description: "Edit for the AS Roma 25/26 second kit launch — cut, grade pass and finishing for the campaign release.",
    videos: [
      "assets/20250616_Adidas%20Roma_2nd%20KIT_EDIT_16x9.mp4"
    ]
  },
  {
    title: "12AM",
    description: "Pants — direction, final edit and sound design on the brand's street-fashion short film.",
    videos: [
      "assets/20260508_12AM_Pants_FINAL.mp4"
    ]
  },
  {
    title: "D.A.W.G.",
    description: "The THIR$TY merch launch and the San Siro director's cut — direction, filming and final edit.",
    videos: [
      "assets/20240915_DAWGxTHIRSTY_EDIT_V1.mp4",
      "assets/20240928_DAWG_SAN%20SIRO_EDIT_DIRECTORS%20CUT.mp4"
    ]
  },
  {
    title: "Fiamma Willem",
    description: "Fashion film for Fiamma — production, filming and the complete edit.",
    videos: [
      "assets/20260323_Fiamma_Willem_EDIT.mp4"
    ]
  },
  {
    title: "Ydez3",
    description: "Music-driven visual piece — shot and cut end to end.",
    videos: [
      "assets/YDEZ3648.MP4"
    ]
  },
  {
    title: "Progetto ADI",
    description: "Intervista Guerriero — a 2'30\" documentary interview, from production to the final cut.",
    videos: [
      "assets/202511222_Progetto%20ADI_2%2730-_Intervista%20Guerriero.mp4"
    ]
  }
];

/* ═══════════════════════════════════════════════════════════════════
   2 · TUNING — feel, not content.
   ═══════════════════════════════════════════════════════════════════ */
const SPAN          = 0.86;   /* share of a chapter slot spent traversing its
                                 videos; the remaining 0.14 is the chapter cut */
const PERSP         = 1200;   /* must match .depth-stack perspective          */
const FAR_UNIT      = 240;    /* px pushed back per unit of depth ahead       */
const NEAR_UNIT     = 620;    /* px pulled toward camera per unit passed      */
const NEAR_EASE     = 1.0;    /* 1 = responds the instant a layer is passed   */
const FADE_OUT      = 0.40;   /* depth over which a passed layer fades away   */
const DIM_DEPTH     = 0.9;    /* depth at which a layer reaches full dimming  */
const DIM_FLOOR     = 0.62;   /* darkest a receding layer gets                */
const CULL_RANGE    = 1.05;   /* beyond this a layer is hidden entirely       */
const NEVER_PAUSE   = true;   /* once a layer has loaded it keeps playing for
                                 the life of the page — nothing ever stops    */
const PLAY_RANGE    = 1.35;   /* only consulted when NEVER_PAUSE is false;
                                 must exceed CULL_RANGE or a visible layer
                                 could be found paused                        */
const LOAD_RANGE    = 2.2;    /* src is attached this far out, so a layer is
                                 buffered and running well before it is seen  */
const SCROLL_UNIT_VH= 125;    /* viewport heights of scroll per depth unit    */
const TAU           = 52;     /* inertia time constant, ms — higher = heavier */
const SHOW_LABELS   = true;   /* placeholder captions when a video is missing */
const AUDIO_FADE    = 0.55;   /* depth over which the focused layer's audio
                                 fades up and away — only ever one layer is
                                 audible, so chapters never talk over each other */
const AUDIO_DUCK    = 0.9;    /* how far audio ducks through a chapter cut     */

/* ═══════════════════════════════════════════════════════════════════
   3 · BUILD — flatten the data into one depth-sorted layer list.
   ═══════════════════════════════════════════════════════════════════ */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const pad2  = n => String(n).padStart(2,'0');

const stack    = document.getElementById('depthStack');
const numerals = document.getElementById('numerals');
const railFill = document.getElementById('railFill');
const railIdx  = document.getElementById('railIdx');
const cutFlash = document.getElementById('cutFlash');
const copyEl   = document.getElementById('chapterCopy');
const titleEl  = document.getElementById('chapterTitle');
const descEl   = document.getElementById('chapterDesc');
const trackEl  = document.getElementById('track');
const reduced  = matchMedia('(prefers-reduced-motion: reduce)').matches;

const CH = chapters.length;

/* layers[]: one entry per video, carrying its absolute position on the
   dolly axis. Chapter c owns axis positions [c, c+1]; its videos are
   spread across [c, c+SPAN] at evenly spaced fractional depths. */
const layers = [];
chapters.forEach((chapter, c) => {
  const n = chapter.videos.length;
  chapter.videos.forEach((src, i) => {
    const depth = n > 1 ? i / (n - 1) : 0;      /* 0 … 1 within the chapter */
    layers.push({ chapter: c, index: i, count: n, depth, src, z: c + depth * SPAN });
  });
});
layers.sort((a, b) => a.z - b.z);

const TOTAL   = layers.length;
const CAM_MAX = layers[TOTAL - 1].z;

/* deterministic placeholder palette — also the video-failure fallback */
function placeholderVars(c, i){
  const hue = (c * 47 + 26) % 360;
  const l   = 40 - i * 4;
  return `--ph1:hsl(${hue} 12% ${l}%);` +
         `--ph2:hsl(${hue} 14% ${(l * 0.48).toFixed(1)}%);` +
         `--ph3:hsl(${(hue + 10) % 360} 16% ${(l * 0.2).toFixed(1)}%)`;
}

layers.forEach(L => {
  const el = document.createElement('div');
  el.className = 'layer no-video';               /* placeholder until a video loads */
  el.innerHTML =
    '<div class="layer-inner">' +
      '<div class="ph" style="' + placeholderVars(L.chapter, L.index) + '">' +
        (SHOW_LABELS
          ? '<span class="ph-tag">' + chapters[L.chapter].title + ' · ' +
            pad2(L.index + 1) + ' / ' + pad2(L.count) + '</span>'
          : '') +
      '</div>' +
      '<video muted loop playsinline preload="none"></video>' +
      '<div class="layer-dim"></div>' +
    '</div>';

  L.el    = el;
  L.dim   = el.querySelector('.layer-dim');
  L.video = el.querySelector('video');
  L.zi    = null;
  L.attached = false;
  L.failed   = false;
  L.playing  = false;
  L.visible  = true;

  /* graceful fallback: a missing or undecodable file just leaves the
     procedural placeholder in place */
  L.video.addEventListener('error', () => { L.failed = true; el.classList.add('no-video'); });
  L.video.addEventListener('loadeddata', () => { if (!L.failed) el.classList.remove('no-video'); });

  stack.appendChild(el);
});

/* chapter numerals — same stacked fill/outline treatment as before,
   now set to the chapter title instead of a "01" index */
chapters.forEach((chapter, c) => {
  const n = document.createElement('div');
  n.className = 'num';
  n.innerHTML = '<span class="num-squeeze"><span class="num-stack">' +
                '<span class="layer out"></span><span class="layer fill"></span></span></span>';
  const t = chapter.title;
  n.querySelector('.fill').textContent = t;
  n.querySelector('.out').textContent  = t;
  numerals.appendChild(n);
});
const nums = [...numerals.querySelectorAll('.num')];

/* a hidden, text-less probe carries the *base* --num-size for this
   breakpoint — kept separate from the real numerals because those get
   scaled down per-title by fitNumerals() below, and the vertical rhythm
   (stride) must stay the same regardless of which title is longest */
const sizeProbe = document.createElement('div');
sizeProbe.className = 'num';
sizeProbe.style.cssText = 'visibility:hidden; position:fixed; left:0; top:0;';
document.body.appendChild(sizeProbe);

/* measured once, not every frame — reading computed style per tick forced
   a style/layout flush that alone cost more than the whole render */
let stride = 0;
function measure(){
  const cs = getComputedStyle(sizeProbe);
  stride = parseFloat(cs.fontSize) * (parseFloat(cs.getPropertyValue('--num-stride')) || .94);
}
measure();

/* long titles ("THIR$TY × D.A.W.G.") would otherwise blow past the
   viewport at the numeral's full display size — shrink just enough per
   title to fit a comfortable max width, leaving short ones untouched */
function fitNumerals(){
  const maxW = Math.min(innerWidth * 0.88, 1600);
  nums.forEach(n => {
    n.style.removeProperty('--num-size');
    const box = n.querySelector('.num-squeeze');
    const natural = box.getBoundingClientRect().width;
    if (natural > maxW){
      const base = parseFloat(getComputedStyle(n).fontSize);
      n.style.setProperty('--num-size', (base * (maxW / natural)).toFixed(2) + 'px');
    }
  });
}
fitNumerals();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNumerals);

/* the scroll track is just height — its length falls out of the data */
trackEl.style.height = (CAM_MAX * SCROLL_UNIT_VH + 100) + 'svh';

/* ═══════════════════════════════════════════════════════════════════
   4 · CAMERA — scroll drives one continuous position on the dolly axis.
   ═══════════════════════════════════════════════════════════════════ */
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
let target = 0, cam = 0, vel = 0, last = 0;
let activeChapter = -1;

function readScroll(){ target = clamp(scrollY / maxScroll() * CAM_MAX, 0, CAM_MAX); }
function goToLayer(i){
  const L = layers[clamp(i, 0, TOTAL - 1)];
  scrollTo({ top: L.z / CAM_MAX * maxScroll(), behavior: reduced ? 'auto' : 'smooth' });
}

/* the layer the camera is currently closest to — the reel's "focus", used
   by the rail, by keyboard stepping and by the audio router */
function nearestIndex(){
  let n = 0, best = Math.abs(layers[0].z - cam);
  for (let k = 1; k < TOTAL; k++){
    const d = Math.abs(layers[k].z - cam);
    if (d < best){ best = d; n = k; }
  }
  return n;
}

function setChapter(c){
  if (c === activeChapter) return;
  activeChapter = c;
  titleEl.textContent = chapters[c].title;
  descEl.textContent  = chapters[c].description;
  /* restart the wipe */
  copyEl.classList.remove('is-on'); void copyEl.offsetWidth; copyEl.classList.add('is-on');
}

/* ═══════════════════════════════════════════════════════════════════
   5 · AUDIO — one voice at a time.

   Every layer plays muted so autoplay is never blocked. Three or four
   of them are running at once, so unmuting the lot would stack their
   soundtracks; instead only the focused layer is ever audible, its gain
   riding the same distance the visuals do, and ducking through the cut
   between chapters. Sound stays off until the viewer asks for it —
   browsers require a gesture before a playing video may unmute.
   ═══════════════════════════════════════════════════════════════════ */
const soundBtn   = document.getElementById('soundToggle');
const soundLabel = document.getElementById('soundLabel');
let soundOn = false;

function applyGain(L, g){
  const v = L.video;
  if (g > 0.002){
    if (Math.abs(v.volume - g) > 0.01) v.volume = g;
    if (v.muted) v.muted = false;
  } else {
    if (!v.muted) v.muted = true;
    if (v.volume !== 0) v.volume = 0;
  }
}

/* gain for the focused layer: fades with distance, dips across the cut */
function focusGain(L, gap){
  const ad = Math.abs(L.z - cam);
  return clamp(1 - ad / AUDIO_FADE, 0, 1) *
         (1 - Math.sin(gap * Math.PI) * AUDIO_DUCK);
}

function routeAudio(nearest, gap){
  for (let k = 0; k < TOTAL; k++){
    const L = layers[k];
    const live = soundOn && k === nearest && L.playing && !L.failed;
    applyGain(L, live ? focusGain(L, gap) : 0);
  }
}

function setSound(on){
  soundOn = on;
  soundBtn.classList.toggle('is-on', on);
  soundBtn.setAttribute('aria-pressed', String(on));
  soundLabel.textContent = on ? 'Audio On' : 'Audio Off';

  if (!on){
    layers.forEach(L => applyGain(L, 0));
    return;
  }
  /* unmute synchronously inside the gesture — Safari pauses a video that
     is unmuted outside one, so this cannot wait for the next frame */
  const k = nearestIndex();
  const L = layers[k];
  if (L && !L.failed && L.attached){
    applyGain(L, Math.max(focusGain(L, 0), 0.05));
    if (!L.playing){
      L.playing = true;
      const pr = L.video.play();
      if (pr && pr.catch) pr.catch(() => {});
    }
  }
}

soundBtn.addEventListener('click', () => setSound(!soundOn));

/* ═══════════════════════════════════════════════════════════════════
   6 · RENDER
   ═══════════════════════════════════════════════════════════════════ */
function render(now){
  const dt   = Math.min(48, now - last || 16.7); last = now;
  const prev = cam;
  cam += (target - cam) * (reduced ? 1 : 1 - Math.exp(-dt / TAU));
  if (Math.abs(target - cam) < 0.00005) cam = target;
  vel = (cam - prev) * (16.7 / dt);

  /* ── depth stack ── */
  for (let k = 0; k < TOTAL; k++){
    const L   = layers[k];
    const rel = L.z - cam;                 /* >0 ahead of camera, <0 passed */
    const ad  = Math.abs(rel);

    /* ── video lifecycle ──
       Runs before the cull test on purpose: a layer must be able to load
       and start while it is still off-camera, so that by the time it is
       visible it is already running rather than spinning up. */
    if (!L.attached && ad <= LOAD_RANGE){
      L.attached = true;
      L.video.preload = 'auto';
      L.video.src = L.src;
    }
    const shouldPlay = (NEVER_PAUSE || ad <= PLAY_RANGE) && !L.failed && L.attached;
    if (shouldPlay && !L.playing){
      L.playing = true;
      const pr = L.video.play();
      if (pr && pr.catch) pr.catch(() => {});
    } else if (!shouldPlay && L.playing){
      L.playing = false;
      L.video.pause();
    }

    if (ad > CULL_RANGE){
      if (L.visible){
        L.visible = false;
        L.el.style.visibility = 'hidden';
        L.el.style.willChange = 'auto';   /* release the compositor layer */
      }
      /* the element is hidden, so the browser already de-prioritises its
         decode — but the video itself keeps running, so scrolling back
         never lands on a stalled or black frame */
      if (!NEVER_PAUSE && L.playing){ L.playing = false; L.video.pause(); }
      continue;
    }
    if (!L.visible){
      L.visible = true;
      L.el.style.visibility = 'visible';
      L.el.style.willChange = 'transform, opacity';
    }

    /* Z: gentle recession ahead, accelerating rush past the camera behind */
    const z = rel >= 0
      ? -rel * FAR_UNIT
      :  Math.pow(-rel, NEAR_EASE) * NEAR_UNIT;

    /* the overscan in .layer-inner absorbs the perspective divide, so the
       plane keeps covering the frame at every depth */
    const opacity = rel >= 0 ? 1 : clamp(1 + rel / FADE_OUT, 0, 1);
    const dim     = rel >= 0 ? (1 - DIM_FLOOR) * clamp(rel / DIM_DEPTH, 0, 1) : 0;

    L.el.style.transform  = 'translate3d(0,0,' + z.toFixed(2) + 'px)';
    L.el.style.opacity    = opacity.toFixed(3);
    L.dim.style.opacity   = dim.toFixed(3);

    const zi = Math.round(1000 - rel * 100);
    if (zi !== L.zi){ L.zi = zi; L.el.style.zIndex = zi; }   /* restacking is not free */
  }

  /* ── chapter coordinate ──
     Holds steady at the active chapter for the whole traversal of its
     videos, then ramps to the next one across the cut. The numerals and
     the copy both key off this, so they can never disagree. */
  const ci  = Math.min(CH - 1, Math.floor(cam));
  const f   = cam - ci;
  const gap = f > SPAN ? (f - SPAN) / (1 - SPAN) : 0;      /* 0 … 1 across the cut */
  const chapterCam = ci + gap;

  /* ── chapter numerals: same rhythm + velocity-driven 3D swing ── */
  for (let c = 0; c < CH; c++){
    const d = c - chapterCam, ad = Math.abs(d);
    const n = nums[c];
    const fill = clamp(1 - 2 * ad, 0, 1);
    n.style.transform = 'translate(-50%,-50%) translateY(' + (d * stride).toFixed(2) + 'px)';
    n.style.opacity   = ad > 3.4 ? 0 : clamp(1 / (1 + 0.9 * ad), 0, 1).toFixed(3);
    n.querySelector('.fill').style.opacity = fill.toFixed(3);
    n.querySelector('.out').style.opacity  = (1 - fill * .92).toFixed(3);
  }
  const v = clamp(vel * 9, -1, 1);
  numerals.style.transform =
    'perspective(1400px) rotateX(' + (v * 13).toFixed(2) + 'deg) rotateZ(' +
    (-v * 17).toFixed(2) + 'deg) scale(' + (1 - Math.abs(v) * .06).toFixed(3) + ')';

  /* ── chapter cut: dip through the gap between two project stacks ── */
  cutFlash.style.opacity = (Math.sin(gap * Math.PI) * 0.34).toFixed(3);

  /* text swaps at the midpoint of the cut — the deepest point of the dip,
     and exactly where the numeral crossfade hands over */
  setChapter(clamp(gap > 0.5 ? ci + 1 : ci, 0, CH - 1));

  /* ── rail: global position across every video in the reel ── */
  railFill.style.transform = 'scaleY(' + (cam / CAM_MAX).toFixed(4) + ')';
  const nearest = nearestIndex();

  /* ── audio: one voice at a time, ducked through the cut ── */
  routeAudio(nearest, gap);

  const idxText = pad2(nearest + 1) + ' — ' + pad2(TOTAL);
  if (railIdx.textContent !== idxText) railIdx.textContent = idxText;

  requestAnimationFrame(render);
}

addEventListener('scroll', readScroll, { passive:true });
addEventListener('resize', () => { readScroll(); measure(); fitNumerals(); });
readScroll(); cam = target;
setChapter(0);
requestAnimationFrame(render);

/* ── keyboard: step between videos, not pixels ── */
addEventListener('keydown', e => {
  const nearest = nearestIndex();
  if (e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); goToLayer(nearest + 1); }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp'  ){ e.preventDefault(); goToLayer(nearest - 1); }
  if (e.key === 'Home'){ e.preventDefault(); goToLayer(0); }
  if (e.key === 'End' ){ e.preventDefault(); goToLayer(TOTAL - 1); }
  if (e.key === 'm' || e.key === 'M'){ e.preventDefault(); setSound(!soundOn); }
});

/* ── playback watchdog ──
   A browser may pause media on its own: a backgrounded tab, a hidden
   element, a decoder under pressure, a network stall. Nothing in the
   render loop would notice, because the loop only calls play() on the
   transition into range. This sweeps once a second and restarts anything
   that should be running but is not — cheap insurance against the reel
   quietly freezing. */
function resumeAll(){
  for (let k = 0; k < TOTAL; k++){
    const L = layers[k];
    if (!L.attached || L.failed || !L.playing) continue;
    if (L.video.paused || L.video.ended){
      const pr = L.video.play();
      if (pr && pr.catch) pr.catch(() => {});
    }
  }
}
setInterval(resumeAll, 1000);
addEventListener('visibilitychange', () => { if (!document.hidden) resumeAll(); });
addEventListener('pageshow', resumeAll);

/* ── camcorder HUD: recording timer ──
   Derived from a fixed origin every tick rather than incremented, so it
   cannot drift or be disturbed by scrolling. */
const timerEl = document.getElementById('recTimer');
const startedAt = performance.now();
function tickTimer(){
  const s = Math.max(0, Math.floor((performance.now() - startedAt) / 1000));
  timerEl.textContent = pad2(Math.floor(s / 3600)) + ':' +
                        pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
}
tickTimer();
setInterval(tickTimer, 250);

})();
</script>
</body>
